{% extends "base.html" %}

{% block titulo %}Editar mis datos · Catálogo de Emprendedores{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Editar mis datos</h1>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "form_campos.html" %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Guardar cambios</button>
                        <a href="{% url 'cuentas:mi_cuenta' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
